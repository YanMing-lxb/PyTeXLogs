# 配置Release Drafter：https://github.com/toolmantim/release-drafter
name-template: 'PyTeXLogs v$version🌈'
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
      - 'kind/feature'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
      - 'regression'
      - 'kind/bug'
  - title: '📝 Docs'
    labels:
      - documentation
      - 'kind/doc'
  - title: '⚙️ CI & Build'
    labels:
      - ci
      - build
      - github-actions
  - title: '🔧 Chores'
    labels:
      - chore
      - dependencies
      - 'kind/chore'
      - 'kind/dep'
exclude-labels:
    - reverted
    - no-changelog
    - skip-changelog
    - invalid
change-template: '* $TITLE (#$NUMBER) @$AUTHOR'
template: |
  ## What’s Changed
  $CHANGES
