name: CI for PyTeXLogs (pure Python package)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests with coverage
        run: uv run pytest tests -v --cov=src/pytexlogs --cov-report=term --cov-report=xml

      - name: Lint with ruff
        if: matrix.python-version == '3.11' && matrix.os == 'windows-latest'
        run: uv run ruff check src tests scripts examples

      - name: Type check with mypy
        if: matrix.python-version == '3.11' && matrix.os == 'windows-latest'
        run: uv run mypy --strict src/pytexlogs

      - name: Build package
        run: uv build

      - name: Upload package artifact
        if: matrix.python-version == '3.11' && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 14
