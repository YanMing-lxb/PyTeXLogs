name: CI for PyTeXLogs (pure Python package)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test-build:
    # 本项目只支持 Python 3.15（见 pyproject 的 requires-python），
    # 且为纯 Python 包，因此不跨版本、不跨平台做矩阵测试，单环境跑全流程即可。
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python 3.15
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests with coverage
        run: uv run pytest tests -v --cov=src/pytexlogs --cov-report=term --cov-report=xml

      - name: Lint with ruff
        run: uv run ruff check src tests

      - name: Build package
        run: uv build

      - name: Upload package artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 14
