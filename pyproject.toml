[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pytexlogs"
dynamic = ["version"]
authors = [
  { name = "焱铭", email = "lxb-yanming@foxmail.com" },
]
description = "LaTeX/BibTeX/Biber/Minted/... 日志解析独立库，从 PyTeXMK 抽离，可嵌入其他工具链。An independent LaTeX/BibTeX/Minted log parser library extracted from PyTeXMK."
keywords = ["LaTeX", "logs", "parser", "latexmk", "bibtex", "biber", "minted", "asymptote"]
dependencies = []
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Homepage = "https://pypi.org/project/pytexlogs"

[project.optional-dependencies]
rich = ["rich>=15.0.0"]

[project.scripts]
pytexlogs = "pytexlogs.cli.main:main"

[project.entry-points."pytexlogs.parsers"]
# reserved for third-party packages

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 声明本包自带类型标注（PEP 561），下游 mypy --strict 才能分析 pytexlogs 而非报 import-untyped
pytexlogs = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "pytexlogs.version.__version__" }

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
# 显式锁定规则集：ruff >=0.13 起未配置 select 时默认启用「全部规则」，
# 升级 ruff 会在毫无代码改动的情况下突然冒出上百条告警。这里固定为
# 「默认 E4/E7/E9 + F + 导入排序 I + pyupgrade UP + bugbear B」这一组，
# 与 PyTeXMK 保持完全一致，保证两个库的检查口径统一。
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]
ignore = ["E501"]          # 行宽由 formatter 负责，不在 lint 阶段报错
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["pytexlogs"]
known-third-party = ["rich"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
publish-url = "https://pypi.org/project/pytexlogs"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "ruff",
    "rich>=15.0.0",
]

[tool.coverage.run]
source = ["src/pytexlogs"]
omit = [
    "src/pytexlogs/parsers/biber.py",
    "src/pytexlogs/parsers/bibtex.py",
    "src/pytexlogs/parsers/glossaries.py",
    "src/pytexlogs/parsers/makeindex.py",
    "src/pytexlogs/parsers/xindy.py",
    "src/pytexlogs/parsers/nomencl.py",
    "src/pytexlogs/core/reftracker.py",
    "src/pytexlogs/display/formatter.py",
    "src/pytexlogs/parsers/latex.py",
    "src/pytexlogs/core/report.py",
    "src/pytexlogs/core/engine.py",
    "src/pytexlogs/core/manager.py",
]

