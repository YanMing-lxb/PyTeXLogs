[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pytexlogs"
dynamic = ["version"]
authors = [
  { name = "焱铭", email = "lxb-yanming@foxmail.com" },
]
description = "LaTeX/BibTeX/Biber/Minted/... 日志解析独立库，从 PyTeXMK 抽离，可嵌入其他工具链。An independent LaTeX/BibTeX/Minted log parser library extracted from PyTeXMK."
keywords = ["LaTeX", "logs", "parser", "latexmk", "bibtex", "biber", "minted", "asymptote"]
dependencies = []
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Homepage = "https://pypi.org/project/pytexlogs"

[project.optional-dependencies]
rich = ["rich>=15.0.0"]

[project.scripts]
pytexlogs = "pytexlogs.cli.main:main"

[project.entry-points."pytexlogs.parsers"]
# reserved for third-party packages

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "pytexlogs.version.__version__" }

[tool.ruff]
line-length = 120

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
publish-url = "https://pypi.org/project/pytexlogs"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.11.0",
    "rich>=15.0.0",
    "coverage>=7.6",
]

[tool.mypy]
python_version = "3.14"
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "rich.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytexlogs.integration_demo"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "pytexlogs.cli"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src/pytexlogs"]
omit = [
    "src/pytexlogs/parsers/biber.py",
    "src/pytexlogs/parsers/bibtex.py",
    "src/pytexlogs/parsers/glossaries.py",
    "src/pytexlogs/parsers/makeindex.py",
    "src/pytexlogs/parsers/xindy.py",
    "src/pytexlogs/parsers/nomencl.py",
    "src/pytexlogs/core/reftracker.py",
    "src/pytexlogs/display/formatter.py",
    "src/pytexlogs/parsers/latex.py",
    "src/pytexlogs/core/report.py",
    "src/pytexlogs/core/engine.py",
    "src/pytexlogs/core/manager.py",
]

